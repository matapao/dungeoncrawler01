# fly.toml app configuration file generated for zirbel on 2026-10-24T07:49:19+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zirbel'
primary_region = 'arn'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[env]
  ZIRBEL_IPV4 = '137.66.25.190'
  ZIRBEL_IPV6 = '2a09:8280:1::1c5:a9c6:0'
  ZIRBEL_PROXY_PROTOCOL = '1'
  ZIRBEL_PUBLIC_URL = 'https://zirbel.network'
  ZIRBEL_STUN = 'fly-global-services:3478'
  ZIRBEL_ZONE = 'zirbel.host'

[[mounts]]
  source = 'zirbel_data'
  destination = '/data'
  initial_size = '1gb'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'proxy_proto']

    [services.ports.tls_options]
      alpn = ['http/1.1']

    [services.ports.proxy_proto_options]
      version = 'v2'

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [services.concurrency]
    type = 'connections'
    hard_limit = 5000
    soft_limit = 4000

[[services]]
  protocol = 'udp'
  internal_port = 3478

  [[services.ports]]
    port = 3478

[checks]
  [checks.health]
    port = 8082
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    path = '/zirbel/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
