name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run audit
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Play the standalone production game in Chrome
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          npm run build
          npm exec vite preview -- --host 127.0.0.1 --port 5184 --strictPort > /tmp/dungeoncrawler-vite.log 2>&1 &
          game_pid=$!
          trap 'kill "$game_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5184/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser -- http://127.0.0.1:5184/
